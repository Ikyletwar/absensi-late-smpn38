plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
}

android {
    namespace 'com.smpn38malteng.absensilate'
    compileSdk 34

    defaultConfig {
        applicationId "com.smpn38malteng.absensilate"
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ksp {
            arg("room.exportSchema", "false")
            arg("room.schemaLocation", "$projectDir/schemas")
        }

        // 🔥 Secrets dari local.properties (tidak ter-commit ke git)
        def localProperties = new Properties()
        def localPropertiesFile = rootProject.file("local.properties")
        if (localPropertiesFile.exists()) {
            localProperties.load(new FileInputStream(localPropertiesFile))
        }
        buildConfigField "String", "TELEGRAM_BOT_TOKEN", "\"${localProperties.getProperty('TELEGRAM_BOT_TOKEN') ?: ''}\""
        buildConfigField "String", "TELEGRAM_CHAT_ID", "\"${localProperties.getProperty('TELEGRAM_CHAT_ID') ?: ''}\""

        // 🔥 DUKUNG 32-BIT DAN 64-BIT
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }

        // 🔥 HANYA BAHASA INDONESIA & INGGRIS
        resourceConfigurations += ['id', 'en']
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            ndk {
                debugSymbolLevel 'none'
            }
        }
        debug {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += [
            "-opt-in=androidx.compose.material3.ExperimentalMaterial3Api"
        ]
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.4'
    }

    lint {
        checkReleaseBuilds = false
        abortOnError = false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation "androidx.fragment:fragment-ktx:1.6.2"  // 🔥 FIX: Required for ActivityResult

    implementation platform('androidx.compose:compose-bom:2024.02.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'

    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'

    // ROOM DATABASE (KSP)
    implementation 'androidx.room:room-runtime:2.6.1'
    ksp 'androidx.room:room-compiler:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation platform('androidx.compose:compose-bom:2024.02.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'

    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    // QR Code dependencies
    implementation 'com.google.mlkit:barcode-scanning:17.2.0'
    implementation 'com.google.zxing:core:3.5.1'

    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.core:core-splashscreen:1.0.1'

    // ============================================
    // 🔥 NEW DEPENDENCIES — VERIFIED PHASE 0
    // ============================================
    // NanoHTTPD 2.3.1 — lightweight HTTP server (verified: Maven Central, actively maintained)
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
}
